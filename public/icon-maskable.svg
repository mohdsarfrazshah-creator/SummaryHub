<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="mBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#3730a3" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="mAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="mSheetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
  </defs>

  <!-- Full bleed background for maskable -->
  <rect width="512" height="512" fill="url(#mBgGrad)" />

  <!-- Centered scaled artwork inside safe zone (60% scale) -->
  <g transform="translate(102, 102) scale(0.6)">
    <!-- Document Backdrop -->
    <rect x="136" y="112" width="240" height="288" rx="28" fill="url(#mSheetGrad)" />
    
    <!-- Document lines -->
    <rect x="176" y="160" width="100" height="18" rx="9" fill="#4f46e5" />
    <rect x="176" y="196" width="160" height="12" rx="6" fill="#94a3b8" />
    <rect x="176" y="222" width="140" height="12" rx="6" fill="#cbd5e1" />
    <rect x="176" y="248" width="160" height="12" rx="6" fill="#94a3b8" />
    <rect x="176" y="274" width="110" height="12" rx="6" fill="#cbd5e1" />

    <!-- Verified Shield Badge Overlay -->
    <g transform="translate(268, 252)">
      <circle cx="56" cy="56" r="50" fill="#0f172a" />
      <circle cx="56" cy="56" r="44" fill="url(#mAccentGrad)" />
      <path d="M42 56 L52 66 L72 44" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Sparkle / AI Star top right -->
    <path d="M344 116 Q356 128 368 128 Q356 128 344 140 Q344 128 332 128 Q344 128 344 116 Z" fill="#fbbf24" />
  </g>
