<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background: Deep Navy Obsidian -->
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1E38" />
      <stop offset="50%" stop-color="#091426" />
      <stop offset="100%" stop-color="#040A14" />
    </linearGradient>

    <!-- Globe Sphere 3D Gradient -->
    <radialGradient id="iconGlobeGrad" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="25%" stop-color="#1E3A8A" />
      <stop offset="55%" stop-color="#0F2454" />
      <stop offset="85%" stop-color="#091636" />
      <stop offset="100%" stop-color="#040B1D" />
    </radialGradient>

    <!-- Crimson Red 3D Swoosh Gradient -->
    <linearGradient id="iconCrimsonSwoosh" x1="10%" y1="90%" x2="95%" y2="15%">
      <stop offset="0%" stop-color="#7F1D1D" />
      <stop offset="20%" stop-color="#991B1B" />
      <stop offset="45%" stop-color="#DC2626" />
      <stop offset="75%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#F87171" />
    </linearGradient>

    <!-- Spherical Clip for Globe Contents -->
    <clipPath id="iconGlobeClip">
      <circle cx="256" cy="236" r="165" />
    </clipPath>
  </defs>

  <!-- Base App Tile Background -->
  <rect width="512" height="512" rx="112" fill="url(#iconBg)" />

  <!-- Subtle Double Border Ring -->
  <rect x="18" y="18" width="476" height="476" rx="98" fill="none" stroke="#DC2626" stroke-width="2" stroke-opacity="0.35" />
  <rect x="26" y="26" width="460" height="460" rx="90" fill="none" stroke="#3B82F6" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="4 6" />

  <!-- Outer Orbit Arc (Navy) -->
  <path 
    d="M 96 186 C 86 96, 186 36, 296 36 C 376 36, 436 76, 426 126 C 416 91, 366 56, 286 56 C 196 56, 116 101, 116 186 C 116 211, 121 236, 136 256 C 116 231, 101 206, 96 186 Z" 
    fill="#1E293B"
    opacity="0.9"
  />

  <!-- Main Globe Sphere Body -->
  <circle cx="256" cy="236" r="165" fill="url(#iconGlobeGrad)" stroke="#1E293B" stroke-width="4" />

  <!-- Clipped Globe Internal Grid & Continents -->
  <g clip-path="url(#iconGlobeClip)">
    <!-- Lat/Long Grid -->
    <g stroke="#93C5FD" stroke-width="2.5" stroke-opacity="0.38" fill="none">
      <line x1="256" y1="71" x2="256" y2="401" />
      <ellipse cx="256" cy="236" rx="65" ry="165" />
      <ellipse cx="256" cy="236" rx="120" ry="165" />
      <line x1="91" y1="236" x2="421" y2="236" />
      <path d="M 111 166 Q 256 196 401 166" />
      <path d="M 111 306 Q 256 276 401 306" />
      <path d="M 141 111 Q 256 131 371 111" />
      <path d="M 141 361 Q 256 341 371 361" />
    </g>

    <!-- Detailed Continents -->
    <g fill="#FFFFFF" fill-opacity="0.96">
      <!-- Arctic / Greenland -->
      <path d="M 231 96 C 241 86, 266 96, 261 116 C 246 121, 236 106, 231 96 Z" />
      <path d="M 201 91 C 216 86, 226 96, 221 106 C 206 106, 201 96, 201 91 Z" />

      <!-- North America -->
      <path d="M 121 141 C 136 121, 166 121, 181 131 C 196 121, 226 126, 236 146 C 231 166, 216 176, 196 181 C 211 186, 221 201, 211 216 C 196 231, 186 221, 176 196 C 166 191, 146 181, 131 171 C 121 161, 116 146, 121 141 Z" />
      <!-- Florida & Caribbean -->
      <path d="M 201 191 C 211 191, 221 206, 211 226 C 201 226, 196 211, 201 191 Z" />
      <circle cx="221" cy="216" r="4" />
      <circle cx="231" cy="226" r="4" />

      <!-- Central America -->
      <path d="M 186 211 C 196 216, 206 231, 196 246 C 186 241, 181 226, 186 211 Z" />

      <!-- South America -->
      <path d="M 196 246 C 216 241, 241 256, 236 286 C 231 316, 216 356, 196 376 C 186 376, 181 346, 186 316 C 176 291, 186 266, 196 246 Z" />

      <!-- Europe -->
      <path d="M 276 116 C 291 106, 306 111, 296 126 C 281 126, 276 121, 276 116 Z" />
      <path d="M 301 91 C 316 86, 331 101, 321 126 C 306 126, 301 106, 301 91 Z" />
      <path d="M 291 126 C 316 121, 341 131, 331 156 C 316 161, 306 146, 291 151 Z" />
      <path d="M 276 151 C 291 146, 301 161, 291 176 C 276 176, 271 161, 276 151 Z" />

      <!-- Africa -->
      <path d="M 276 186 C 306 176, 351 186, 356 216 C 366 231, 351 251, 346 276 C 336 311, 316 341, 296 346 C 286 346, 281 326, 286 301 C 276 296, 266 271, 271 241 C 266 221, 271 196, 276 186 Z" />
      <!-- Madagascar -->
      <path d="M 356 291 C 366 286, 371 301, 366 321 C 356 321, 351 306, 356 291 Z" />
    </g>

    <!-- Inner Spherical Rim Glow -->
    <circle cx="256" cy="236" r="165" stroke="#60A5FA" stroke-width="4" stroke-opacity="0.35" fill="none" />
  </g>

  <!-- Lower Left Orbit Arc -->
  <path 
    d="M 96 266 C 106 326, 156 386, 236 406 C 211 391, 156 361, 126 296 Z" 
    fill="#1E293B"
    opacity="0.85"
  />

  <!-- SIGNATURE CRIMSON RED DYNAMIC 3D CRESCENT SWOOSH -->
  <path 
    d="M 86 341 C 146 391, 266 406, 366 346 C 421 306, 466 236, 476 156 C 456 246, 391 316, 296 346 C 201 366, 131 356, 86 341 Z" 
    fill="url(#iconCrimsonSwoosh)"
  />

  <!-- Swoosh Top Luminous Highlight -->
  <path 
    d="M 96 341 C 156 386, 276 396, 376 341 C 426 301, 466 236, 476 156" 
    stroke="#FECACA" 
    stroke-width="3" 
    stroke-opacity="0.8" 
    fill="none"
  />
</svg>